services: 
  mcp:
    build: .
    image: mcp4immich:local
    environment:
      IMMICH_BASE_URL: ${IMMICH_BASE_URL:-http://host.docker.internal:2283}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      IMMICH_API_TOKEN: ${IMMICH_API_TOKEN:-}
      # IMMICH_EXTERNAL_DOMAIN configures the web UI domain for link building in tool responses (optional)
      # Example: https://immich.example.com (used to generate links like /photos/<id>, /albums/<id>, etc)
      # Uncomment to override (default: discovered from /api/server-config externalDomain)
      # IMMICH_EXTERNAL_DOMAIN: ${IMMICH_EXTERNAL_DOMAIN:-https://immich.example.com}
      # IMMICH_PROFILE restricts tool exposure based on permission level (optional)
      # Options: read_only (search/browse only), read_write (assets/albums), full_scope (all including admin)
      # Uncomment to limit access level (default: no profile restriction, depends on API key permissions)
      # IMMICH_PROFILE: ${IMMICH_PROFILE:-read_only}
      # IMMICH_PROFILE: ${IMMICH_PROFILE:-read_write}
      # IMMICH_PROFILE: ${IMMICH_PROFILE:-full_scope}
      IMMICH_WRITE_PROBE_PATH: ${IMMICH_WRITE_PROBE_PATH:-}
      IMMICH_WRITE_PROBE_METHOD: ${IMMICH_WRITE_PROBE_METHOD:-POST}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-sse}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-8000}
      MCP_MOUNT_PATH: ${MCP_MOUNT_PATH:-}
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-INFO}
    ports:
      - "${MCP_PORT:-8000}:${MCP_PORT:-8000}"
