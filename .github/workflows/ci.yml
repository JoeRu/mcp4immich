name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests with coverage
        run: uv run pytest tests/ -v --cov=mcp4immich --cov-report=xml -m "not integration"

      - name: Assert the dependency pin is bounded
        run: |
          grep -q 'mcp\[cli\]>=2.2,<3' pyproject.toml || {
            echo "mcp dependency must keep an upper bound (see CHANGELOG 1.0.0)"; exit 1; }

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Every advisory this repo carried at 1.0.0 lived in uv.lock, under direct
      # dependencies that looked perfectly current. Audit the resolved set, not
      # the declared one.
      - name: Audit locked dependencies for known vulnerabilities
        run: uvx uv-secure@latest uv.lock
