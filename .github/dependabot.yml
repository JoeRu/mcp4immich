# Keep dependency updates arriving as PRs rather than accumulating silently.
# Every alert this repo had at 1.0.0 was transitive and sat in uv.lock: the
# direct dependencies are only httpx, mcp[cli] and anyio, so nothing in
# pyproject.toml looked out of date while 30 advisories were open underneath it.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine churn; security fixes still come through
      # Dependabot alerts individually.
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
